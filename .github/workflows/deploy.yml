name: Deploy to EC2

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment variables and deploy
        run: |
          if [[ "${GITHUB_REF##*/}" == "qa" ]]; then
            echo "ENV=qa" >> $GITHUB_ENV
            echo "${{ secrets.EC2_KEY_QA }}" > key.pem
            chmod 600 key.pem
            ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER_QA }}@${{ secrets.EC2_HOST_QA }} << 'ENDSSH'
              cd ~/infra-backend-services
              git pull origin qa
              docker compose down
              docker compose up -d --build
ENDSSH
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "${{ secrets.EC2_KEY_PROD }}" > key.pem
            chmod 600 key.pem
            ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} << 'ENDSSH'
              cd ~/infra-backend-services
              git pull origin main
              docker compose down
              docker compose up -d --build
ENDSSH
