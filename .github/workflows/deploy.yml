name: Deploy to EC2

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment variables
        run: |
          if [[ "${GITHUB_REF##*/}" == "qa" ]]; then
            echo "ENV=qa" >> $GITHUB_ENV
            echo "EC2_HOST=${{ secrets.EC2_HOST_QA }}" >> $GITHUB_ENV
            echo "EC2_USER=${{ secrets.EC2_USER_QA }}" >> $GITHUB_ENV
